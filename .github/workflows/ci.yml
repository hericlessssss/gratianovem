name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Validate and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Type Check
        # O script de build do Vite as vezes não falha com erro de tipo,
        # então rodamos o tsc explicitamente para garantir.
        run: npx tsc -b

      - name: Test Build
        # Verifica se o build de produção completa sem erros
        run: npm run build
